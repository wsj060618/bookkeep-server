# bookkeep 单机部署用的完整 Nginx 配置（由 deploy/start-all.bat 以 -c 加载）
# 这里的 __FRONTEND_DIST__ 会被 env.bat 的 FRONTEND_DIST 替换，生成 nginx.generated.conf，
# 所以改前端目录只改 env.bat 一处；本文件本身不能直接给 nginx 用。

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    gzip              on;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  _;

        # 前端产物（另一个仓库），启动时由 env.bat 的 FRONTEND_DIST 替换
        root   __FRONTEND_DIST__;
        index  index.html;

        # 带 hash 的静态资源可以长缓存
        location /assets/ {
            expires 1y;
        }

        # SPA 用 createWebHistory：直接刷新 /login、/report/xxx 要回落到 index.html（PLAN §8 第 22 条）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 入口 html 不缓存，避免升级后浏览器还拿旧文件名
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # 反代后端。注意 proxy_pass 不带尾斜杠：后端控制器本身就是 /api/**，不能把前缀剥掉
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}