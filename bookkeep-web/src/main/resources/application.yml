server:
  port: 8080
  # 默认只绑回环：对外统一走 Nginx，局域网不能绕过反代直连后端（PLAN §1、§8 第 21 条）
  # 容器部署时由 compose 设 SERVER_ADDRESS=0.0.0.0（容器内网，不 publish 8080）
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: bookkeep-server
  # 流水导入是 multipart：默认上限只有 1MB，导入 5MB 以内的文件会被拦
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/bookkeep?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PWD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 找回密码发信（QQ 邮箱 SMTP）。三个值都来自环境变量；没配时启动照常，
  # forgot-password 仍回 200 但不发信（见 PasswordResetServiceImpl）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000

app:
  mail:
    # 发件人地址，必须是 MAIL_USERNAME 那个邮箱（QQ 会校验发件人一致）；只放纯地址
    from: ${MAIL_FROM:}
    # 发件人显示名（收件人看到的「谁发来的」）；默认用项目名
    from-name: ${MAIL_FROM_NAME:bookkeep}
  # 拼重置链接用（邮件里点到哪台机器）；本机部署填局域网地址
  base-url: ${APP_BASE_URL:http://localhost}
  security:
    # 登录/注册限流（support/AuthThrottle）。这里放宽松值给局域网开发用，
    # 公网严格值在 application-prod.yml：IP 30 次/分、注册 5 次/小时
    login-max-failures: 5
    login-ip-per-minute: 100000
    register-per-hour: 100000

mybatis-plus:
  # 手写 SQL 放 XML：默认值就是 classpath*:/mapper/**/*.xml，这里显式写出来，
  # 一是不靠默认值（别人接手不用猜），二是换目录时不会出现「启动正常但 Invalid bound statement」。
  # 注意必须是 classpath*:（带星），service 模块是独立 jar，不带星可能只扫到第一个匹配。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 部署时用环境变量 JWT_SECRET 覆盖（deploy/env.ps1）；换这个值会让已签发的 token 全部失效
  secret: ${JWT_SECRET:bookkeep-jwt-secret-key-please-change-me-0123456789}
  # 秒；公网建议 1 天（86400），本地开发用 7 天
  expire: ${JWT_EXPIRE:604800}
