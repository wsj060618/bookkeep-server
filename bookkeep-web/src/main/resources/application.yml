server:
  port: 8080
  # 只绑回环：对外统一走 Nginx，局域网不能绕过反代直连后端（PLAN §1、§8 第 21 条）
  address: 127.0.0.1

spring:
  application:
    name: bookkeep-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bookkeep?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PWD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  # 手写 SQL 放 XML：默认值就是 classpath*:/mapper/**/*.xml，这里显式写出来，
  # 一是不靠默认值（别人接手不用猜），二是换目录时不会出现「启动正常但 Invalid bound statement」。
  # 注意必须是 classpath*:（带星），service 模块是独立 jar，不带星可能只扫到第一个匹配。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 部署时用环境变量 JWT_SECRET 覆盖（deploy/env.ps1）；换这个值会让已签发的 token 全部失效
  secret: ${JWT_SECRET:bookkeep-jwt-secret-key-please-change-me-0123456789}
  expire: 604800
