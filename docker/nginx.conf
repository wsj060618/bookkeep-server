# 公网 Nginx（默认配置）：**纯 HTTP，直接用 IP 访问**
#
# 为什么默认不做 HTTPS：国内云服务器的域名必须备案，裸 IP 又签不到可信证书
# （Let's Encrypt 不给 IP 签）。所以取证阶段就是 http://IP/，用不了 https。
# 想要 HTTPS 只有两条路：① 备案域名 + 国内服务器 ② 境外/香港服务器 + 任意域名。
# 那时改用同目录的 nginx.tls.conf（compose 里设 NGINX_CONF=./nginx.tls.conf 并挂 certs）。
#
# 没有 TLS 的补偿措施：登录限流（应用内 + 这里）、JWT 有效期压到 1 天、
# 8080/3306 不 publish、只开 80。**不要在这个环境里用常用密码**。

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # 导入包单包 200MB、单张图片 10MB：默认 1m 会让上传直接 413，
    # 这里放宽到 210m（表单开销 + 余量），业务层自己再判 10MB/200MB 并给友好提示
    client_max_body_size 210m;

    gzip              on;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # 登录/注册/忘记密码的 Nginx 层粗限流（应用内还有按账号的精确限流）
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # 没有 HSTS：HSTS 只在 HTTPS 下有意义，明文站点加上去只会把浏览器锁死在 https
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location /assets/ {
            expires 1y;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 认证相关：额外限流（burst 允许连点几次，超出直接 429）
        location ~ ^/api/auth/(login|register|forgot-password)$ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass         http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass         http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # 票据 zip 导出、导入大文件：默认 60s 对慢网不够
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}