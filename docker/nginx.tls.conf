# 公网 Nginx：80 跳 HTTPS，443 反代 app:8080
# 证书放 docker/certs/fullchain.pem + privkey.pem（Let's Encrypt / Cloudflare Origin / 自签测试均可）
# server_name 用 _ 表示接受任意域名；绑定了域名后建议改成具体域名。

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 2m;

    gzip              on;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # 登录/注册/忘记密码的 Nginx 层粗限流（应用内还有按账号的精确限流）
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        root  /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location /assets/ {
            expires 1y;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 认证相关：额外限流（burst 允许连点几次，超出直接 429）
        location ~ ^/api/auth/(login|register|forgot-password)$ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass         http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass         http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}