# 公网部署用 compose：mysql + app + nginx
# 安全约定：
#   - mysql 只绑 127.0.0.1（给 SSH 隧道 / Navicat 用，公网进不来），app 完全不 publish
#   - 对外只有 nginx 的 80/443
#   - 所有密钥来自 .env（见 .env.example），不进仓库

name: bookkeep

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bookkeep
      MYSQL_USER: bookkeep
      MYSQL_PASSWORD: ${DB_PWD:?请在 .env 里设置 DB_PWD}
    volumes:
      - db_data:/var/lib/mysql
      # 只有空数据卷时才会执行：新库建表；已有库请手动跑 migration_*.sql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # 只绑回环：公网 3306 依然进不来，只在服务器本机可用（配合 ssh -L 用 Navicat/DBeaver）
    # 云安全组也不要开 3306，否则这行等于白写
    ports:
      - "127.0.0.1:3306:3306"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: bookkeep
      DB_PWD: ${DB_PWD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET（≥32 字符）}
      JWT_EXPIRE: ${JWT_EXPIRE:-86400}
      # 容器内必须监听 0.0.0.0 才能被 nginx 访问；8080 不 publish，外部仍然进不来
      SERVER_ADDRESS: 0.0.0.0
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-bookkeep}
      APP_BASE_URL: ${APP_BASE_URL:?请在 .env 里设置 APP_BASE_URL，例如 https://你的域名}
      # 票据图片落在命名卷里（不放镜像、不放数据库卷）：docker compose down 不丢，down -v 才删
      RECEIPT_DIR: /app/data/receipts
    volumes:
      - receipts_data:/app/data/receipts

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${FRONTEND_DIST:-../bookkeep-web/dist}:/usr/share/nginx/html:ro
      # 只有改走 TLS（nginx.tls.conf + 备案域名/境外服务器）时才需要证书目录
      - ./certs:/etc/nginx/certs:ro

volumes:
  db_data:
  # 票据图片（PLAN §10.9）。备份：docker compose exec app tar czf - -C /app/data receipts > receipts.tgz
  receipts_data: